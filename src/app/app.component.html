<mat-toolbar color="primary">
  <mat-toolbar-row>
    <div class="mb full-width">
      <button (click)="incrementZoom(-0.1)" mat-button type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>

      <mat-form-field class="page-number">
        <input matInput type="number" placeholder="Увеличение" [(ngModel)]="zoom" pattern="-?[0-9]*(\.[0-9]+)?">
        <mat-error>Это не число!</mat-error>
      </mat-form-field>

      <button (click)="incrementZoom(0.1)" mat-button type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </button>
    </div>

    <div>
      <button (click)="incrementPage(-1)" mat-button type="button">
        Предыдущий
      </button>

      <mat-form-field class="page-number">
        <input matInput type="number" placeholder="Страница" [(ngModel)]="page" pattern="-?[0-9]*(\.[0-9]+)?">
        <mat-error>Это не число!</mat-error>
      </mat-form-field>

      <span *ngIf="pdf">из {{ pdf.numPages }}</span>
      <button (click)="incrementPage(1)" mat-button type="button">
        Следующий
      </button>
    </div>

    <!-- Поиск в toolbar -->
    <div class="mb">
      <mat-form-field class="full-width">
        <mat-label>Поиск</mat-label>
        <input #queryInp matInput id="pdfQueryInput" type="text" placeholder="Search..." [value]="pdfQuery"
          (input)="searchQueryChanged($any($event.target).value)" (keyup.enter)="searchQueryChanged(queryInp.value)">
        <mat-hint>Поиск по всему PDF-файлу</mat-hint>
      </mat-form-field>
    </div>
  </mat-toolbar-row>
</mat-toolbar>

<mat-drawer-container class="example-container">

  <!-- ОСНОВНОЕ СОДЕРЖИМОЕ -->
  <mat-drawer-content>
    <pdf-viewer [src]="pdfSrc"
                [(page)]="page"
                [rotation]="rotation"
                [original-size]="originalSize"
                [show-all]="showAll"
                [fit-to-page]="fitToPage"
                (after-load-complete)="afterLoadComplete($event)"
                [zoom]="zoom"
                [zoom-scale]="zoomScale"
                [stick-to-page]="stickToPage"
                [render-text]="renderText"
                [external-link-target]="'blank'"
                [autoresize]="autoresize"
                (error)="onError($event)"
                (on-progress)="onProgress($event)"
                (page-rendered)="pageRendered($event)"
                (pages-initialized)="pageInitialized($event)"
                (pageChange)="pageChange($event)"
                [show-borders]="false"
    ></pdf-viewer>
  </mat-drawer-content>
</mat-drawer-container>
